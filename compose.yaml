services:
  postgres:
    image: postgres:17
    container_name: supportflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow_user
      POSTGRES_PASSWORD: supportflow_password

    ports:
      - "5432:5432"

    volumes:
      - supportflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow_user -d supportflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  supportflow_postgres_data: